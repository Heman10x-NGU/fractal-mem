[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fractalmem"
version = "2.1.0"
description = "A prefix-cache-invariant hierarchical agent memory engine"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Hemant Sharma" }
]
dependencies = [
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
    "tree-sitter>=0.26.0,<0.27",
    "tree-sitter-python>=0.25.0,<0.26",
    "tree-sitter-javascript>=0.25.0,<0.26",
    "tree-sitter-typescript>=0.23.0,<0.24",
    "httpx>=0.28.0",
    "mcp>=2.3.0,<3",
    "tiktoken>=0.8.0",
    "regex>=2025.11.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "mypy>=1.14.0",
    "ruff>=0.9.0",
    "types-pyyaml>=6.0.12",
    "types-regex>=2025.11.3",
]

[project.scripts]
fractald = "fractalmem.daemon.server:main"
fractalmem-hook = "fractalmem.client:main"

[tool.hatch.build.targets.wheel]
packages = ["fractalmem"]

[tool.hatch.build]
exclude = ["benchmarks/datasets/downloads/**", "results/**", "plans/evidence/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "C4",
    "UP",
]
ignore = [
    "E501", # Line length handled by formatter
]
